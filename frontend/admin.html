<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MySemicon Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2a1f38">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/admin.css?v=9">
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" class="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <button class="menu" id="menu" aria-label="Menu">&#9776;</button>
      <h1 id="title">Dashboard</h1>
      <div class="gs"><input id="gs" type="search" placeholder="Search orders, customers, products…" aria-label="Search" autocomplete="off"><div id="gsr" class="gsr" hidden></div></div>
      <div class="bellw"><button class="bell" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bc" id="bellc" hidden></span></button><div id="bellm" class="bellm" hidden></div></div>
      <div class="who" id="who"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>The admin panel needs JavaScript.</noscript>
<script src="/js/push.js?v=1"></script>
<script src="/js/admin.js?v=10"></script>
<script src="/js/admin-catalog.js?v=4"></script>
<script src="/js/admin-content.js?v=3"></script>
</body>
</html>
